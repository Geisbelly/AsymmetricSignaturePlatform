<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SignVault{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #080c10;
            --surface: #0e1420;
            --border: #1e2d42;
            --accent: #00e5ff;
            --accent2: #7b2fff;
            --ok: #00e676;
            --danger: #ff1744;
            --text: #c8d8e8;
            --muted: #4a6080;
            --mono: 'Space Mono', monospace;
            --sans: 'Syne', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--sans);
            min-height: 100vh;
            background-image:
                radial-gradient(ellipse 60% 40% at 80% 10%, rgba(123,47,255,0.08) 0%, transparent 60%),
                radial-gradient(ellipse 40% 30% at 10% 80%, rgba(0,229,255,0.06) 0%, transparent 60%);
        }

        nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 2rem;
            border-bottom: 1px solid var(--border);
            background: rgba(8,12,16,0.9);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-family: var(--mono);
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--accent);
            letter-spacing: 0.05em;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .logo span {
            color: var(--accent2);
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }

        .nav-links a {
            color: var(--muted);
            text-decoration: none;
            font-size: 0.85rem;
            font-family: var(--mono);
            padding: 0.4rem 0.8rem;
            border-radius: 4px;
            transition: color 0.2s, background 0.2s;
        }

        .nav-links a:hover { color: var(--accent); background: rgba(0,229,255,0.05); }

        .nav-user {
            font-family: var(--mono);
            font-size: 0.8rem;
            color: var(--muted);
            padding: 0.4rem 0.8rem;
            border: 1px solid var(--border);
            border-radius: 4px;
            margin-right: 0.5rem;
        }

        .nav-links a.danger { color: #ff4466; }
        .nav-links a.danger:hover { background: rgba(255,23,68,0.1); }

        main {
            max-width: 860px;
            margin: 3rem auto;
            padding: 0 1.5rem;
        }

        h1, h2, h3 {
            font-family: var(--sans);
            font-weight: 800;
            letter-spacing: -0.02em;
        }

        h1 { font-size: 2.2rem; margin-bottom: 0.5rem; }
        h2 { font-size: 1.5rem; margin-bottom: 1.5rem; color: var(--text); }
        h3 { font-size: 1.1rem; margin-bottom: 1rem; }

        .tag {
            font-family: var(--mono);
            font-size: 0.7rem;
            color: var(--accent);
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 1.25rem;
            transition: border-color 0.2s;
        }
        .card:hover { border-color: rgba(0,229,255,0.2); }

        label {
            display: block;
            font-family: var(--mono);
            font-size: 0.75rem;
            color: var(--muted);
            letter-spacing: 0.1em;
            margin-bottom: 0.4rem;
            text-transform: uppercase;
        }

        input[type=text], input[type=password], textarea, select {
            width: 100%;
            background: rgba(0,0,0,0.4);
            border: 1px solid var(--border);
            border-radius: 5px;
            color: var(--text);
            font-family: var(--mono);
            font-size: 0.9rem;
            padding: 0.7rem 1rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            margin-bottom: 1rem;
        }

        input:focus, textarea:focus, select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(0,229,255,0.1);
        }

        textarea { min-height: 120px; resize: vertical; }

        button, .btn {
            font-family: var(--mono);
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            padding: 0.7rem 1.5rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: all 0.2s;
        }

        .btn-primary {
            background: var(--accent);
            color: #000;
        }
        .btn-primary:hover { background: #33ecff; box-shadow: 0 0 20px rgba(0,229,255,0.3); }

        .btn-secondary {
            background: transparent;
            color: var(--accent);
            border: 1px solid var(--accent);
        }
        .btn-secondary:hover { background: rgba(0,229,255,0.08); }

        .btn-purple {
            background: var(--accent2);
            color: #fff;
        }
        .btn-purple:hover { background: #9050ff; box-shadow: 0 0 20px rgba(123,47,255,0.3); }

        .alert {
            padding: 0.8rem 1rem;
            border-radius: 5px;
            font-family: var(--mono);
            font-size: 0.85rem;
            margin-bottom: 1rem;
            border-left: 3px solid;
        }
        .alert-err { background: rgba(255,23,68,0.08); border-color: var(--danger); color: #ff6688; }
        .alert-ok  { background: rgba(0,230,118,0.08); border-color: var(--ok); color: var(--ok); }
        .alert-info { background: rgba(0,229,255,0.05); border-color: var(--accent); color: var(--accent); }

        .mono { font-family: var(--mono); }
        .muted { color: var(--muted); }
        .small { font-size: 0.8rem; }

        .badge {
            font-family: var(--mono);
            font-size: 0.7rem;
            padding: 0.2rem 0.6rem;
            border-radius: 3px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }
        .badge-ok { background: rgba(0,230,118,0.15); color: var(--ok); border: 1px solid rgba(0,230,118,0.3); }
        .badge-err { background: rgba(255,23,68,0.15); color: var(--danger); border: 1px solid rgba(255,23,68,0.3); }
        .badge-info { background: rgba(0,229,255,0.1); color: var(--accent); border: 1px solid rgba(0,229,255,0.2); }

        .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }

        hr { border: none; border-top: 1px solid var(--border); margin: 1.5rem 0; }

        .sig-id {
            font-family: var(--mono);
            font-size: 2rem;
            font-weight: 700;
            color: var(--accent);
        }

        code, pre {
            font-family: var(--mono);
            font-size: 0.8rem;
            background: rgba(0,0,0,0.5);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 0.15rem 0.4rem;
            color: var(--accent);
            word-break: break-all;
        }

        pre { padding: 1rem; display: block; overflow-x: auto; white-space: pre-wrap; }

        a { color: var(--accent); text-decoration: none; }
        a:hover { text-decoration: underline; }

        table {
            width: 100%;
            border-collapse: collapse;
            font-family: var(--mono);
            font-size: 0.82rem;
        }
        th {
            text-align: left;
            color: var(--muted);
            font-size: 0.72rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            padding: 0.5rem 0.75rem;
            border-bottom: 1px solid var(--border);
        }
        td {
            padding: 0.65rem 0.75rem;
            border-bottom: 1px solid rgba(30,45,66,0.5);
            color: var(--text);
        }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: rgba(0,229,255,0.02); }

        .flex { display: flex; align-items: center; gap: 0.75rem; }
        .flex-between { display: flex; align-items: center; justify-content: space-between; }
        .mt1 { margin-top: 1rem; }
        .mb1 { margin-bottom: 1rem; }
    </style>
</head>
<body>

<nav>
    <div class="logo">◈ Sign<span>Vault</span></div>

    <div class="nav-links">
        {% if session.get("user_nome") %}
            <span class="nav-user">👤 {{ session["user_nome"] }}</span>
            <a href="/dashboard">Dashboard</a>
            <a href="/sign">Assinar</a>
            <a href="/chat">Chat</a>
            <a href="/history">Histórico</a>
            <a href="/verify">Verificar</a>
            <a href="/mykey">Minha chave</a>
            <a href="/logout" class="danger">Sair</a>
        {% else %}
            <a href="/login">Login</a>
            <a href="/register">Cadastro</a>
            <a href="/verify">Verificar</a>
            <a href="/test">Testes</a>
            <a href="/test">Testes</a>
        {% endif %}
    </div>
</nav>

<main>
    {% block content %}{% endblock %}
</main>

</body>
</html>
